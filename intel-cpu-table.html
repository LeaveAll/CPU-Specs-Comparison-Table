<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intel Desktop CPUs — 6th Gen onwards</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --txt:#e6e9ef; --dim:#9aa3b2;
    --accent:#4c9aff; --head:#1d2129; --stick:#151922; --pc:#7ee787; --ec:#ffb86b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header{padding:10px 14px 8px;background:var(--panel);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:40}
  h1{margin:0 0 8px;font-size:15px;font-weight:600;letter-spacing:.2px}
  h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  #search{flex:1 1 320px;min-width:240px;background:#0c0e13;border:1px solid var(--line);
    color:var(--txt);border-radius:6px;padding:7px 10px;font-size:13px;outline:none}
  #search:focus{border-color:var(--accent)}
  .filters{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .filters .lbl{color:var(--dim);margin-right:4px}
  .chk{display:inline-flex;align-items:center;gap:5px;background:#0c0e13;border:1px solid var(--line);
    border-radius:5px;padding:4px 8px;cursor:pointer;user-select:none;white-space:nowrap}
  .chk input{accent-color:var(--accent);margin:0;cursor:pointer}
  .chk.off{opacity:.45;text-decoration:line-through}
  .chk .cnt{color:var(--dim);font-size:11px}
  button.mini{background:#0c0e13;border:1px solid var(--line);color:var(--txt);border-radius:5px;
    padding:5px 9px;cursor:pointer}
  button.mini:hover{border-color:var(--accent)}
  #status{color:var(--dim);font-size:12px;white-space:nowrap}

  .wrap{width:100%;overflow:auto;height:calc(100vh - 92px)}
  table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
  th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    padding:5px 8px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  thead th{position:sticky;top:0;z-index:20;background:var(--head);font-weight:600;
    user-select:none;cursor:pointer;color:#cdd4e0}
  thead th:hover{color:#fff}
  th.sticky,td.sticky{position:sticky;left:0;z-index:15;background:var(--stick);
    box-shadow:2px 0 0 0 var(--line)}
  thead th.sticky{z-index:30;background:#222735}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  th.num{text-align:right}
  .model{font-weight:600}
  .sfx{display:inline-block;margin-left:7px;font-size:10px;font-weight:800;letter-spacing:.4px;
    padding:1px 5px;border-radius:4px;color:#0b0d12;vertical-align:1px;
    box-shadow:0 0 0 1px rgba(0,0,0,.45), 0 0 6px -1px currentColor}
  .s-K {background:#ffd33d}
  .s-KF{background:#ff9f43}
  .s-KS{background:#ff6b6b}
  .s-F {background:#5ab9ff}
  .s-T {background:#4ee6c4}
  .s-S {background:#c58cff}

  /* generation banding */
  tbody tr.band td{background:#1a2030}
  tbody tr.band td.sticky{background:#202739}
  tbody tr.gtop td{border-top:2px solid #46536b}
  tbody tr:hover td{background:#232a36 !important}
  tbody tr:hover td.sticky{background:#2b3443 !important}
  .pc{color:var(--pc)} .ec{color:var(--ec)} .tot{color:var(--dim)}
  .up{color:#7ee787} .down{color:#ff7b72} .flat{color:var(--dim)}
  .arrow{margin-left:5px;font-size:10px;color:var(--accent)}
  .rs{position:absolute;top:0;right:0;width:13px;height:100%;cursor:col-resize;z-index:5}
  .rs:hover{background:linear-gradient(90deg,transparent,var(--accent))}
  tfoot td{color:var(--dim);border:none;padding:8px}
  .hint{color:var(--dim);font-size:11px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>Intel Desktop CPUs — 6th Gen onwards <span id="count"></span></h1>

    <input id="search" placeholder='Search models — comma separated, e.g.  6700k, 9500, 14900'>
    <div class="filters" id="filters"><span class="lbl">Show suffix:</span></div>
    <button class="mini" id="reset">Reset</button>
  </div>
  <div class="hint">Drag a column edge to resize · double-click the right edge of a header to fit the widest cell, double-click again to shrink to the narrowest · click a header to sort</div>
</header>

<div class="wrap" id="wrap">

    <thead><tr id="hrow"></tr></thead>
    <tbody id="body"></tbody>

</div>

/* ---------------- derive ---------------- */
function suffixOf(m){
  const t = m.trim().toUpperCase();
  const mm = t.match(/(KS|KF|K|F|T|S)(?: PLUS)?$/);
  if(!mm) return "—";
  // guard: "Core Ultra 5 245" ends in digit, fine. Only letter suffixes matched.
  return mm[1];
}
function tierOf(m){
  if(/Ultra 9/.test(m)) return 9; if(/Ultra 7/.test(m)) return 7; if(/Ultra 5/.test(m)) return 5;
  if(/^i9/.test(m)) return 9; if(/^i7/.test(m)) return 7; if(/^i5/.test(m)) return 5;
  if(/^i3/.test(m)) return 3;
  if(/^Pentium/.test(m)) return 2; if(/^Intel Processor/.test(m)) return 2;
  if(/^Celeron/.test(m)) return 1;
  return 3;
}
function familyOf(m){
  if(/^Celeron/.test(m)) return "Celeron";
  if(/^Pentium/.test(m)) return "Pentium";
  if(/^Intel Processor/.test(m)) return "Intel Processor";
  return "Core";
}
const DATA = RAW.map(r=>{
  const [model,gen,co,turbo,l3,tdp,ovr]=r;
  const g=Object.assign({},GENS[gen],ovr||{});
  let cores,threads,coresHtml;
  if(co.c!==undefined){
    cores=co.c; threads=co.c*(co.ht?2:1);
    coresHtml=`<span class="pc">${co.c}C ${co.ht?"(HT)":"(no HT)"}</span><span class="tot"> · ${cores}C / ${threads}T</span>`;
  }else{
    cores=co.p+co.e; threads=co.p*(co.pht?2:1)+co.e;
    coresHtml=`<span class="pc">${co.p}P ${co.pht?"(HT)":"(no HT)"}</span> + <span class="ec">${co.e}E (no HT)</span><span class="tot"> · ${cores}C / ${threads}T</span>`;
  }
  return {model,gen,genName:g.name,arch:g.arch,node:g.node,cores,threads,coresHtml,
    turbo,l3,socket:g.socket,chipset:g.chipset,mem:g.mem,ipc:g.ipc,tdp,
    sfx:suffixOf(model),tier:tierOf(model),family:familyOf(model)};
});

/* ---------------- columns ---------------- */
const COLS=[
  {k:"model",  t:"Processor Model", w:190, sticky:true, num:false,
   v:r=>r.model, h:r=>`<span class="model">${r.model}</span>`+(r.sfx!=="—"?`<span class="sfx s-${r.sfx}">${r.sfx}</span>`:"")},
  {k:"gen",    t:"Generation", w:145, sort:"num", v:r=>r.gen, h:r=>r.genName, txt:r=>r.genName},
  {k:"arch",   t:"Architecture", w:300, v:r=>r.arch},
  {k:"node",   t:"Process Node", w:110, num:true, v:r=>+r.node, txt:r=>r.node},
  {k:"cores",  t:"Cores / Threads", w:250, num:true, v:r=>r.threads, h:r=>r.coresHtml,
   txt:r=>r.coresHtml.replace(/<[^>]+>/g,"")},
  {k:"turbo",  t:"Max Turbo", w:100, num:true, v:r=>r.turbo, txt:r=>r.turbo.toFixed(1)+" GHz"},
  {k:"l3",     t:"L3 Cache", w:95, num:true, v:r=>r.l3, txt:r=>r.l3+" MB"},
  {k:"socket", t:"Socket", w:110, v:r=>r.socket},
  {k:"chipset",t:"Chipset", w:275, v:r=>r.chipset},
  {k:"mem",    t:"DDR Memory", w:250, v:r=>r.mem},
  {k:"ipc",    t:"IPC Uplift vs Prev. Gen", w:170, num:true, v:r=>r.ipc,
   txt:r=>(r.ipc>0?"+":"")+r.ipc+"%",
   h:r=>`<span class="${r.ipc>0?'up':(r.ipc<0?'down':'flat')}">${r.ipc>0?"+":""}${r.ipc}%</span>`},
  {k:"tdp",    t:"TDP", w:85, num:true, v:r=>r.tdp, txt:r=>r.tdp+" W"}
];
COLS.forEach(c=>{ if(!c.txt) c.txt=r=>String(c.v(r)); if(!c.h) c.h=r=>c.txt(r); });

/* ---------------- state ---------------- */
const SUFFIXES=["—","S","T","K","F","KS","KF"];
const SLABEL={"—":"No suffix","S":"S","T":"T","K":"K","F":"F","KS":"KS","KF":"KF"};
const state={sort:[], filters:new Set(SUFFIXES), query:"", fitState:{}};

/* default sort: newest gen first, then tier, then turbo, then threads, then name */
function defaultCmp(a,b){
  return b.gen-a.gen || b.tier-a.tier || b.turbo-a.turbo || b.threads-a.threads ||
         a.model.localeCompare(b.model);
}

/* ---------------- filters UI ---------------- */
const fbox=document.getElementById("filters");
SUFFIXES.forEach(s=>{
  const n=DATA.filter(r=>r.sfx===s).length;
  const l=document.createElement("label"); l.className="chk"; l.dataset.s=s;
  if(!n) l.style.opacity=.35;
  l.innerHTML=`<input type="checkbox" checked><span>${SLABEL[s]}</span><span class="cnt">${n}</span>`;
  l.querySelector("input").addEventListener("change",e=>{
    e.target.checked?state.filters.add(s):state.filters.delete(s);
    l.classList.toggle("off",!e.target.checked); render();
  });
  fbox.appendChild(l);
});

document.getElementById("search").addEventListener("input",e=>{state.query=e.target.value;render();});
document.getElementById("reset").addEventListener("click",()=>{
  state.query=""; document.getElementById("search").value="";
  state.sort=[]; state.filters=new Set(SUFFIXES);
  state.fitState={};
  fbox.querySelectorAll("label.chk").forEach(l=>{l.classList.remove("off");l.querySelector("input").checked=true;});
  COLS.forEach((c,i)=>setWidth(i,c.w));
  render();
});

/* ---------------- header ---------------- */
const hrow=document.getElementById("hrow");
const cg=document.getElementById("cg");
const tbl=document.getElementById("tbl");
const wrapEl=document.getElementById("wrap");
COLS.forEach((c,i)=>{
  const col=document.createElement("col"); col.style.width=c.w+"px"; cg.appendChild(col);
  const th=document.createElement("th");
  th.className=(c.sticky?"sticky ":"")+(c.num?"num ":"");
  th.style.width=c.w+"px";
  th.innerHTML=`<span class="lbl">${c.t}</span><span class="arrow" data-a></span><div class="rs"></div>`;
  th.addEventListener("click",ev=>{ if(ev.target.classList.contains("rs"))return; toggleSort(i,ev.shiftKey); });
  const rs=th.querySelector(".rs");
  rs.addEventListener("mousedown",ev=>startDrag(ev,i));
  rs.addEventListener("dblclick",ev=>{ev.stopPropagation();ev.preventDefault();autoFit(i);});
  rs.addEventListener("click",ev=>ev.stopPropagation());
  hrow.appendChild(th);
});
function syncTableWidth(){
  const total=COLS.reduce((a,c)=>a+c.w,0);
  tbl.style.width=Math.max(total,wrapEl.clientWidth)+"px";
  /* keep the sticky first column pinned correctly */
  document.documentElement.style.setProperty("--c0",COLS[0].w+"px");
}
function setWidth(i,px){
  px=Math.max(40,Math.round(px));
  COLS[i].w=px;
  cg.children[i].style.width=px+"px";
  hrow.children[i].style.width=px+"px";
  syncTableWidth();
}
window.addEventListener("resize",syncTableWidth);
syncTableWidth();

/* resize drag */
let drag=null;
function startDrag(ev,i){
  ev.preventDefault(); ev.stopPropagation();
  drag={i,x:ev.clientX,w:COLS[i].w};
  document.body.style.cursor="col-resize";
}
window.addEventListener("mousemove",e=>{ if(drag) setWidth(drag.i, drag.w + (e.clientX-drag.x)); });
window.addEventListener("mouseup",()=>{ if(drag){drag=null;document.body.style.cursor="";} });

/* auto fit: widest <-> narrowest.
   Measured by rendering each cell's real markup into an off-screen clone of the
   cell, so the result is the exact pixel width the content needs — no guessing. */
const ruler=document.createElement("div");
ruler.style.cssText="position:absolute;left:-99999px;top:0;visibility:hidden;white-space:nowrap";
document.body.appendChild(ruler);
function contentWidths(i,rows){
  const c=COLS[i];
  const probe=document.createElement("span");
  probe.style.whiteSpace="nowrap";
  ruler.innerHTML=""; ruler.appendChild(probe);
  const sample=document.querySelector(`#body tr td:nth-child(${i+1})`)||hrow.children[i];
  const cs=getComputedStyle(sample);
  ruler.style.font=cs.font||`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  ruler.style.fontFamily=cs.fontFamily; ruler.style.fontSize=cs.fontSize;
  ruler.style.fontWeight=cs.fontWeight; ruler.style.letterSpacing=cs.letterSpacing;
  return rows.map(r=>{ probe.innerHTML=c.h(r); return probe.getBoundingClientRect().width; });
}
function autoFit(i){
  const rows=currentRows(); if(!rows.length) return;
  const c=COLS[i];
  const sample=document.querySelector(`#body tr td:nth-child(${i+1})`)||hrow.children[i];
  const cs=getComputedStyle(sample);
  const chrome=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+
               parseFloat(cs.borderRightWidth||1)+1; /* padding + cell border only */
  const w=contentWidths(i,rows);
  const mode=state.fitState[i]==="max"?"min":"max";
  state.fitState[i]=mode;
  setWidth(i, Math.ceil((mode==="max"?Math.max(...w):Math.min(...w))+chrome));
}
function fitAllColumns(){
  state.fitState={};
  COLS.forEach((c,i)=>autoFit(i));
}

/* ---------------- sorting ---------------- */
function toggleSort(i,add){
  const cur=state.sort.find(s=>s.i===i);
  if(cur){ cur.dir=-cur.dir; if(!add) state.sort=[cur]; }
  else{
    const s={i,dir:(COLS[i].num||COLS[i].sort==="num")?-1:1};
    state.sort = add ? state.sort.concat(s) : [s];
  }
  render();
}
function cmpBy(a,b){
  for(const s of state.sort){
    const c=COLS[s.i]; let x=c.v(a), y=c.v(b), d;
    if(typeof x==="number"&&typeof y==="number") d=x-y;
    else d=String(x).localeCompare(String(y),undefined,{numeric:true});
    if(d) return d*s.dir;
  }
  return defaultCmp(a,b);
}

/* ---------------- filtering ---------------- */
function currentRows(){
  const terms=state.query.split(/[,;\n]+/).map(t=>t.trim().toLowerCase()).filter(Boolean);
  let rows=DATA.filter(r=>state.filters.has(r.sfx));
  if(terms.length) rows=rows.filter(r=>{
    const hay=(r.model+" "+r.genName+" "+r.arch).toLowerCase();
    return terms.some(t=>hay.includes(t));
  });
  rows.sort(state.sort.length?cmpBy:defaultCmp);
  return rows;
}

/* ---------------- render ---------------- */
function render(){
  const rows=currentRows();
  const body=document.getElementById("body");
  /* band consecutive runs of the same generation so groups read as blocks */
  let band=false, prevGen=null;
  body.innerHTML=rows.map(r=>{
    const first = r.gen!==prevGen;
    if(first && prevGen!==null) band=!band;
    prevGen=r.gen;
    const cls=(band?"band ":"")+(first?"gtop":"");
    return `<tr class="${cls}">`+COLS.map(c=>
      `<td class="${c.sticky?"sticky ":""}${c.num?"num ":""}" title="${c.txt(r).replace(/"/g,'&quot;')}">${c.h(r)}</td>`
    ).join("")+"</tr>";
  }).join("");
  COLS.forEach((c,i)=>{
    const a=hrow.children[i].querySelector("[data-a]");
    const s=state.sort.findIndex(x=>x.i===i);
    a.textContent = s<0 ? "" : (state.sort[s].dir>0?"▲":"▼")+(state.sort.length>1?(s+1):"");
  });
  document.getElementById("count").textContent=`— ${rows.length} of ${DATA.length} models shown`;
}
render();
fitAllColumns();
</script>
